{% extends 'base.html' %}
{% block title %}
    Delete {{ movie.title }} | Movie Now
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card shadow-lg border-0 text-center">
                <div class="card-body p-5">
                    <i class="bi bi-exclamation-triangle-fill text-danger display-3"></i>
                    <h2 class="fw-bold mt-4">Delete Movie?</h2>
                    <p class="text-secondary">
                        Are you sure you want to delete <strong>{{ movie.title }}</strong>?
                    </p>
                    <p class="text-danger">
                        This action cannot be undone.
                    </p>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'movie_detail' movie.id %}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <form method="POST">
                            {% csrf_token %}
                            <button type="submit"
                                    class="btn btn-danger">
                                <i class="bi bi-trash"></i>Delete Movie
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
